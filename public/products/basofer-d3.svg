<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow4">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Clean Background -->
  <rect width="400" height="300" fill="url(#bgGradient4)"/>
  
  <!-- Subtle Floor Shadow -->
  <ellipse cx="200" cy="270" rx="100" ry="15" fill="#000000" opacity="0.08"/>
  
  <!-- Iron Supplement Bottle -->
  <g filter="url(#shadow4)">
    <!-- Bottle Shadow on Base -->
    <ellipse cx="200" cy="265" rx="35" ry="8" fill="#000000" opacity="0.06"/>
    
    <!-- Main Bottle Shape -->
    <path d="M 170 100 Q 165 130 168 160 L 168 220 Q 168 240 185 245 L 215 245 Q 232 240 232 220 L 232 160 Q 235 130 230 100 Z" 
          fill="#FF7777" stroke="#E74C3C" stroke-width="1.5" opacity="0.95"/>
    
    <!-- Bottle Cap -->
    <rect x="185" y="65" width="30" height="40" rx="3" fill="#C0392B" stroke="#A93226" stroke-width="1"/>
    <rect x="185" y="58" width="30" height="10" rx="2" fill="#E74C3C" stroke="#C0392B" stroke-width="0.5"/>
    
    <!-- Cap Details -->
    <line x1="190" y1="65" x2="190" y2="102" stroke="#A93226" stroke-width="0.5" opacity="0.5"/>
    <line x1="210" y1="65" x2="210" y2="102" stroke="#A93226" stroke-width="0.5" opacity="0.5"/>
    
    <!-- Glass Highlight -->
    <ellipse cx="180" cy="130" rx="12" ry="50" fill="#ffffff" opacity="0.25"/>
    <ellipse cx="178" cy="180" rx="8" ry="25" fill="#ffffff" opacity="0.15"/>
    
    <!-- Liquid Level -->
    <path d="M 170 200 Q 172 202 200 202 Q 228 202 230 200 L 230 220 Q 230 240 215 245 L 185 245 Q 170 240 170 220 Z" 
          fill="#FF9999" opacity="0.6"/>
  </g>
  
  <!-- Label -->
  <g>
    <rect x="175" y="145" width="50" height="55" rx="2" fill="#ffffff" opacity="0.98" stroke="#FF7777" stroke-width="0.5"/>
    <text x="200" y="158" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#E74C3C">BASOFER</text>
    <text x="200" y="173" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#E74C3C">D3</text>
    <text x="200" y="192" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#999">Iron Support</text>
  </g>
</svg>