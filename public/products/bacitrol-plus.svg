    <ellipse cx="150" cy="105" rx="22" ry="35" fill="#F5B041" stroke="#F39C12" stroke-width="1" opacity="0.9"/>
    <ellipse cx="156" cy="90" rx="8" ry="12" fill="#ffffff" opacity="0.3"/>
    
    <!-- Capsule 2 -->
    <ellipse cx="200" cy="85" rx="22" ry="35" fill="#F5B041" stroke="#F39C12" stroke-width="1" opacity="0.9"/>
    <ellipse cx="206" cy="70" rx="8" ry="12" fill="#ffffff" opacity="0.3"/>
    
    <!-- Capsule 3 -->
    <ellipse cx="250" cy="105" rx="22" ry="35" fill="#F5B041" stroke="#F39C12" stroke-width="1" opacity="0.9"/>
    <ellipse cx="256" cy="90" rx="8" ry="12" fill="#ffffff" opacity="0.3"/>
    
    <!-- Capsule 4 -->
    <ellipse cx="150" cy="170" rx="22" ry="35" fill="#F5B041" stroke="#F39C12" stroke-width="1" opacity="0.9"/>
    <ellipse cx="156" cy="155" rx="8" ry="12" fill="#ffffff" opacity="0.3"/>
    
    <!-- Capsule 5 -->
    <ellipse cx="200" cy="190" rx="22" ry="35" fill="#F5B041" stroke="#F39C12" stroke-width="1" opacity="0.9"/>
    <ellipse cx="206" cy="175" rx="8" ry="12" fill="#ffffff" opacity="0.3"/>
    
