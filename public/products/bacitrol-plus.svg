    <ellipse cx="250" cy="170" rx="22" ry="35" fill="#F5B041" stroke="#F39C12" stroke-width="1" opacity="0.9"/>
    <ellipse cx="256" cy="155" rx="8" ry="12" fill="#ffffff" opacity="0.3"/>
