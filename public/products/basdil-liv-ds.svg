<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Clean Background -->
  <rect width="400" height="300" fill="url(#bgGradient2)"/>
  
  <!-- Subtle Floor Shadow -->
  <ellipse cx="200" cy="270" rx="100" ry="15" fill="#000000" opacity="0.08"/>
  
  <!-- Syrup Bottle -->
  <g filter="url(#shadow2)">
    <!-- Bottle Shadow on Base -->
    <ellipse cx="200" cy="265" rx="35" ry="8" fill="#000000" opacity="0.06"/>
    
    <!-- Main Bottle Shape -->
    <path d="M 170 95 Q 165 125 168 155 L 168 220 Q 168 240 185 245 L 215 245 Q 232 240 232 220 L 232 155 Q 235 125 230 95 Z" 
          fill="#5FD95F" stroke="#27AE60" stroke-width="1.5" opacity="0.95"/>
    
    <!-- Wooden Cap -->
    <rect x="185" y="55" width="30" height="45" rx="4" fill="#8B6F47" stroke="#6B5335" stroke-width="1"/>
    <circle cx="200" cy="57" r="5" fill="#A0825D" stroke="#6B5335" stroke-width="0.5"/>
    
    <!-- Cap Details -->
    <line x1="188" y1="65" x2="212" y2="65" stroke="#6B5335" stroke-width="0.5" opacity="0.3"/>
    <line x1="188" y1="75" x2="212" y2="75" stroke="#6B5335" stroke-width="0.5" opacity="0.3"/>
    <line x1="188" y1="85" x2="212" y2="85" stroke="#6B5335" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Glass Highlight -->
    <ellipse cx="180" cy="130" rx="12" ry="50" fill="#ffffff" opacity="0.25"/>
    <ellipse cx="178" cy="190" rx="8" ry="20" fill="#ffffff" opacity="0.15"/>
    
    <!-- Liquid Level -->
    <path d="M 170 195 Q 172 197 200 197 Q 228 197 230 195 L 230 220 Q 230 240 215 245 L 185 245 Q 170 240 170 220 Z" 
          fill="#85E585" opacity="0.5"/>
  </g>
  
  <!-- Label -->
  <g>
    <rect x="175" y="140" width="50" height="60" rx="2" fill="#ffffff" opacity="0.98" stroke="#5FD95F" stroke-width="0.5"/>
    <text x="200" y="158" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#27AE60">Basdil</text>
    <text x="200" y="170" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#27AE60">Liv-DS</text>
    <text x="200" y="187" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#999">Liver Care</text>
    <text x="200" y="197" font-family="Arial, sans-serif" font-size="6" text-anchor="middle" fill="#aaa">Syrup 225ml</text>
  </g>
</svg>